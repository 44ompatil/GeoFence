; PlatformIO Project Configuration File for ESP32 DevKit V1
; GeoFence Animal Tracking Collar System

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, default

; Shared libraries across environments
lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    bblanchon/ArduinoJson @ ^7.0.4

; -------------------------------------------------------------
; 1. MAIN INTEGRATED FIRMWARE (All Sensors + Logic + Alerts)
; -------------------------------------------------------------
[env:esp32dev]
build_src_filter = +<main.cpp>

; -------------------------------------------------------------
; 2. UNIT TEST: MPU-6050 / MPU-6500 Sensor Identifier & Motion
; -------------------------------------------------------------
[env:test_mpu]
build_src_filter = +<test_mpu.cpp>

; -------------------------------------------------------------
; 3. UNIT TEST: NEO-6M GPS Data & Satellite Fix Diagnostic
; -------------------------------------------------------------
[env:test_gps]
build_src_filter = +<test_gps.cpp>

; -------------------------------------------------------------
; 4. UNIT TEST: Output Module (Green/Yellow/Red LEDs + Buzzer)
; -------------------------------------------------------------
[env:test_alerts]
build_src_filter = +<test_alerts.cpp>

; -------------------------------------------------------------
; 5. LIVE SENSOR MONITOR (GPS + IMU + Optional Battery ADC)
; -------------------------------------------------------------
[env:test_live]
build_src_filter = +<test_live.cpp>
